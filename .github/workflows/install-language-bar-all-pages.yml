name: Install language bar on all archive pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-language-bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add persistent Čeština English Deutsch bar to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse

          root = Path('.')
          pages = sorted(p for p in root.glob('*.html') if p.is_file())
          existing = {p.name for p in pages}

          css = '''\n<style id="site-language-bar-style">\n.site-language-bar{position:sticky;top:0;z-index:1000;background:rgba(251,251,248,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #d7dde2;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}\n.site-language-bar-inner{max-width:960px;margin:auto;padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:10px}\n.site-language-bar a{color:#39434a;text-decoration:none;font-weight:700;font-size:14px;padding:5px 9px;border-radius:3px;white-space:nowrap}\n.site-language-bar a.current{background:#17202a;color:#fff}\n@media(max-width:480px){.site-language-bar-inner{padding:9px 12px;gap:4px}.site-language-bar a{font-size:13px;padding:5px 7px}}\n</style>\n'''

          script = '''\n<script id="site-language-bar-script">\n(function(){\n  const bar=document.querySelector('.site-language-bar');\n  if(!bar) return;\n  bar.querySelectorAll('a[data-site-lang]').forEach(a=>{\n    a.addEventListener('click',function(e){\n      const lang=this.dataset.siteLang;\n      const nativeButton=document.querySelector('[data-switch="'+lang+'"]');\n      if(nativeButton){\n        e.preventDefault();\n        nativeButton.click();\n        bar.querySelectorAll('a').forEach(x=>x.classList.remove('current'));\n        this.classList.add('current');\n        try{history.replaceState(null,'',location.pathname+'#'+lang)}catch(_){}\n      }\n    });\n  });\n  const hash=(location.hash||'').replace('#','');\n  if(['cs','en','de'].includes(hash)){\n    const nativeButton=document.querySelector('[data-switch="'+hash+'"]');\n    const link=bar.querySelector('[data-site-lang="'+hash+'"]');\n    if(nativeButton&&link){nativeButton.click();bar.querySelectorAll('a').forEach(x=>x.classList.remove('current'));link.classList.add('current');}\n  }\n})();\n</script>\n'''

          def strip_old_bar(text):
              text = re.sub(r'<nav class="langbar"[^>]*>.*?</nav>\s*', '', text, flags=re.S)
              text = re.sub(r'\.langbar\{[^}]*\}\.langbar-inner\{[^}]*\}\.langbar a\{[^}]*\}\.langbar a\.current\{[^}]*\}', '', text)
              text = re.sub(r'\n?<style id="site-language-bar-style">.*?</style>\n?', '\n', text, flags=re.S)
              text = re.sub(r'\n?<nav class="site-language-bar".*?</nav>\n?', '\n', text, flags=re.S)
              text = re.sub(r'\n?<script id="site-language-bar-script">.*?</script>\n?', '\n', text, flags=re.S)
              return text

          def language_info(name):
              stem = name[:-5]
              if stem.endswith('-cs'):
                  return stem[:-3], 'cs'
              if stem.endswith('-de'):
                  return stem[:-3], 'de'
              return stem, 'en'

          for path in pages:
              text = path.read_text(encoding='utf-8')
              original = text
              text = strip_old_bar(text)
              base, lang = language_info(path.name)

              en_name = f'{base}.html'
              cs_name = f'{base}-cs.html'
              de_name = f'{base}-de.html'
              page_url = f'https://stationzbiroh.github.io/StationZbiroh/{en_name}'

              has_inline_cs = 'data-switch="cs"' in text
              has_inline_de = 'data-switch="de"' in text
              has_inline_en = 'data-switch="en"' in text

              cs_href = '#cs' if has_inline_cs else (cs_name if cs_name in existing else 'https://translate.google.com/translate?sl=en&tl=cs&u=' + urllib.parse.quote(page_url, safe=''))
              de_href = '#de' if has_inline_de else (de_name if de_name in existing else 'https://translate.google.com/translate?sl=en&tl=de&u=' + urllib.parse.quote(page_url, safe=''))
              en_href = '#en' if has_inline_en else en_name

              links = [
                  ('cs', cs_href, 'Čeština'),
                  ('en', en_href, 'English'),
                  ('de', de_href, 'Deutsch'),
              ]
              items = ''.join(
                  f'<a data-site-lang="{code}"{(" class=\"current\"" if code == lang else "")} href="{href}">{label}</a>'
                  for code, href, label in links
              )
              bar = f'\n<nav class="site-language-bar" aria-label="Language"><div class="site-language-bar-inner">{items}</div></nav>\n'

              if '</head>' in text:
                  text = text.replace('</head>', css + '</head>', 1)
              if re.search(r'<body[^>]*>', text, flags=re.I):
                  text = re.sub(r'(<body[^>]*>)', r'\1' + bar, text, count=1, flags=re.I)
              if '</body>' in text:
                  text = text.replace('</body>', script + '</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          PY

      - name: Commit site-wide language navigation
        run: |
          if git diff --quiet; then
            echo "No language-bar changes needed."
            exit 0
          fi
          git config user.name "Station Zbiroh"
          git config user.email "zbirohstation@gmail.com"
          git add '*.html'
          git commit -m "Standardise language bar across all archive pages"
          git push
