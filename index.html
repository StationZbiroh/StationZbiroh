<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stanice Zbiroh — Historical Research Archive</title>
<link rel="canonical" href="https://stationzbiroh.github.io/StationZbiroh/stanice-zbiroh.html">
<meta http-equiv="refresh" content="0; url=stanice-zbiroh.html">
<script>location.replace('stanice-zbiroh.html'+location.search+location.hash);</script>

<style id="site-language-bar-style">
.site-language-bar{position:sticky;top:0;z-index:1000;background:rgba(251,251,248,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #d7dde2;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.site-language-bar-inner{max-width:960px;margin:auto;padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:10px}
.site-language-bar a{color:#39434a;text-decoration:none;font-weight:700;font-size:14px;padding:5px 9px;border-radius:3px;white-space:nowrap}
.site-language-bar a.current{background:#17202a;color:#fff}
.site-native-language-switch{display:none!important}
[data-switch]{display:none!important}
.languages,.language-switch,.language-switcher,.lang-switch,.lang-switcher,.lang-buttons,.language-buttons{display:none!important}
@media(max-width:480px){.site-language-bar-inner{padding:9px 12px;gap:4px}.site-language-bar a{font-size:13px;padding:5px 7px}}
</style>
</head>
<body>
<nav class="site-language-bar" aria-label="Language"><div class="site-language-bar-inner"><a data-site-lang="cs" href="https://translate.google.com/translate?sl=en&tl=cs&u=https%3A%2F%2Fstationzbiroh.github.io%2FStationZbiroh%2Findex.html">Čeština</a><a data-site-lang="en" class="current" href="index.html">English</a><a data-site-lang="de" href="https://translate.google.com/translate?sl=en&tl=de&u=https%3A%2F%2Fstationzbiroh.github.io%2FStationZbiroh%2Findex.html">Deutsch</a></div></nav>

<p><a href="stanice-zbiroh.html">Open the Stanice Zbiroh overview and timeline</a></p>

<script id="site-language-bar-script">
(function(){
  const bar=document.querySelector('.site-language-bar');
  if(!bar) return;
  bar.querySelectorAll('a[data-site-lang]').forEach(a=>{
    a.addEventListener('click',function(e){
      const lang=this.dataset.siteLang;
      const nativeButton=document.querySelector('[data-switch="'+lang+'"]');
      if(nativeButton){
        e.preventDefault();
        nativeButton.click();
        bar.querySelectorAll('a').forEach(x=>x.classList.remove('current'));
        this.classList.add('current');
        try{history.replaceState(null,'',location.pathname+'#'+lang)}catch(_){}
      }
    });
  });
  const hash=(location.hash||'').replace('#','');
  if(['cs','en','de'].includes(hash)){
    const nativeButton=document.querySelector('[data-switch="'+hash+'"]');
    const link=bar.querySelector('[data-site-lang="'+hash+'"]');
    if(nativeButton&&link){nativeButton.click();bar.querySelectorAll('a').forEach(x=>x.classList.remove('current'));link.classList.add('current');}
  }
})();
</script>
</body>
</html>
